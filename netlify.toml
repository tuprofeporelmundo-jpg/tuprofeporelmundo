[build]
  publish = "site"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Solo se cargan recursos de la propia web. El aula habla además con Supabase (cuentas y material).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://plausible.io https://csnofemrppaqnnwirusx.supabase.co wss://csnofemrppaqnnwirusx.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# El aula no debe aparecer en buscadores
[[headers]]
  for = "/aula/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
